name: Audio Library Sync & Upload

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies with Chrome Impersonator
        run: |
          python -m pip install --upgrade pip
          pip install "yt-dlp[default,curl-cffi]" google-api-python-client google-auth-httplib2 google-auth-oauthlib requests urllib3

      - name: Run Uploader Script
        run: python uploader.py

      - name: Commit Tracker History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded_music.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update uploaded tracks list [skip ci]" && git push)

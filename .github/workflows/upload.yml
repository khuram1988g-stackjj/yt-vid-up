name: Audio Library Sync (Private)

on:
  schedule:
    # Daily at 5:00 PM PKT (12:00 PM UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib requests

      - name: Run Uploader Script
        run: |
          python uploader.py

      - name: Commit Tracker File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f uploaded_music.json ]; then
            git add uploaded_music.json
            git commit -m "Update uploaded_music.json tracker" || echo "No changes to commit"
            git push
          else
            echo "Tracker file not found, skipping."
          fi
